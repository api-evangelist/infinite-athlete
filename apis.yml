aid: infinite-athlete
name: Infinite Athlete
description: >-
  Infinite Athlete is a sports technology company that brings together leading
  companies in performance biomechanics and real-time video to deliver
  data-driven, actionable insights for elite athlete evaluation, development,
  health, and safety. Its work spans athlete performance frameworks, biomechanics
  research and development, a real-time video and data capture technology
  platform, facility design and hardware installation, sports operational
  efficiency, and equipment/facility/surface analysis and certification for major
  leagues and teams. Its developer-facing product is FusionFeed, a sports and
  performance data API (REST, GraphQL, and the proprietary FQL query language)
  built on the Tempus Ex platform that exposes schedules, rosters, official and
  automated statistics, telemetry, video feeds, and virtual camera data. The
  developer platform is currently invite-only. Infinite Athlete is backed by a16z
  and has been recognized among the "10 Most Innovative Sports Tech Companies" by
  Sports Business Journal.
