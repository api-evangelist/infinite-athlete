apis:
- name: FusionFeed
  description: >-
    FusionFeed is Infinite Athlete's sports and performance data API, built on the
    Tempus Ex platform. It provides schedules, team rosters on a game-by-game
    basis, official stats delivered the moment the stats crew submits them,
    automated statistics, telemetry, video feeds, and virtual camera data. The API
    is accessible over REST, GraphQL, and the proprietary FusionFeed Query Language
    (FQL). Access is invite-only; authentication supports long-lived API keys, JWT
    bearer tokens, and OAuth2 via Okta or Amazon Cognito identity providers.
  humanURL: https://docs.tempus-ex.com/fusionfeed
